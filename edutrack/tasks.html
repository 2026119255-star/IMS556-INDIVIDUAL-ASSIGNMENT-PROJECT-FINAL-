<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduTrack task board: add, edit, delete and filter assignments by status.">
  <meta name="keywords" content="EduTrack, tasks, assignments, deadlines">
  <meta name="author" content="Your Name">
  <title>Tasks | EduTrack</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('edutrack.theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">

  <div id="topbar"></div>

  <div class="app-shell">

    <div class="app-content">
      <main class="container-fluid px-3 px-lg-4 py-4">

        <header class="mb-4 d-flex flex-wrap justify-content-between align-items-end gap-3">
          <div>
            <h1 class="h3 mb-1">My Tasks</h1>
            <p class="text-muted mb-0">Assignments and deadlines, sorted by due date.</p>
          </div>
          <button type="button" class="btn btn-primary" id="add-task-btn">+ Add task</button>
        </header>

        <p class="small text-body-secondary mb-3" id="task-filter-note" aria-live="polite"></p>

        <div class="mb-4" role="group" aria-label="Filter tasks by status">
          <div class="btn-group flex-wrap" role="group">
            <button type="button" class="btn btn-outline-primary active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="btn btn-outline-primary" data-filter="Pending" aria-pressed="false">Pending</button>
            <button type="button" class="btn btn-outline-primary" data-filter="In Progress" aria-pressed="false">In Progress</button>
            <button type="button" class="btn btn-outline-primary" data-filter="Completed" aria-pressed="false">Completed</button>
          </div>
        </div>

        <section aria-label="Task list">
          <div class="row g-4" id="task-grid"></div>
        </section>

      </main>

      <div id="site-footer"></div>
    </div>
  </div>

  <!-- Add / edit task modal -->
  <div class="modal fade" id="task-modal" tabindex="-1" aria-labelledby="task-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="task-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="task-modal-title">Add task</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="task-title" class="form-label">Task title</label>
            <input type="text" id="task-title" class="form-control" maxlength="120" required>
            <div class="invalid-feedback">Please enter a title (at least 3 characters).</div>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="task-course" class="form-label">Course</label>
              <select id="task-course" class="form-select" required></select>
              <div class="invalid-feedback">Please choose a course.</div>
            </div>
            <div class="col-md-6">
              <label for="task-due" class="form-label">Due date</label>
              <input type="date" id="task-due" class="form-control" required>
              <div class="invalid-feedback">Please choose a due date.</div>
            </div>
            <div class="col-md-6">
              <label for="task-priority" class="form-label">Priority</label>
              <select id="task-priority" class="form-select">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="task-status" class="form-label">Status</label>
              <select id="task-status" class="form-select">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="task-submit">Add task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/ed.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
