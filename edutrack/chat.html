<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduTrack chat: ask the study assistant about tasks, deadlines and course progress in course channels.">
  <meta name="keywords" content="EduTrack, chat, assistant, channels">
  <meta name="author" content="Your Name">
  <title>Chat | EduTrack</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('edutrack.theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">

  <div id="topbar"></div>

  <div class="app-shell">

    <div class="app-content">
      <main class="container-fluid px-3 px-lg-4 py-4">

        <header class="mb-4">
          <h1 class="h3 mb-1">Study Chat</h1>
          <p class="text-muted mb-0">Ask the assistant about your tasks, deadlines and progress.</p>
        </header>

        <div class="row g-3">
          <div class="col-lg-3">
            <div class="card h-100 shadow-sm">
              <div class="card-header fw-semibold">Channels</div>
              <div class="list-group list-group-flush" id="channel-list"></div>
            </div>
          </div>

          <div class="col-lg-9">
            <div class="card shadow-sm">
              <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                  <h2 class="h6 mb-0" id="channel-title">#General</h2>
                  <small class="text-muted" id="channel-subtitle">Assistant</small>
                </div>
                <div class="d-flex gap-2">
                  <input type="search" id="chat-search" class="form-control form-control-sm"
                         placeholder="Search messages" aria-label="Search messages">
                  <button id="clear-chat" class="btn btn-outline-danger btn-sm" type="button">Clear</button>
                </div>
              </div>

              <div class="chat-thread" id="chat-thread" role="log" aria-live="polite" aria-label="Messages"></div>

              <div class="px-3 pt-2 small text-muted d-none" id="typing-indicator">Assistant is typing&hellip;</div>

              <div class="px-3 pt-2 pb-1 d-flex flex-wrap gap-2" aria-label="Quick commands">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-command="/tasks">/tasks</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-command="/progress">/progress</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-command="/help">/help</button>
              </div>

              <form id="chat-form" class="card-footer bg-transparent">
                <div class="input-group">
                  <textarea id="chat-input" class="form-control" rows="1" maxlength="500"
                            placeholder="Type a message (Enter to send, Shift+Enter for a new line)"
                            aria-label="Message"></textarea>
                  <button class="btn btn-primary" type="submit">Send</button>
                </div>
              </form>
            </div>
          </div>
        </div>

      </main>

      <div id="site-footer"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/ed.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
