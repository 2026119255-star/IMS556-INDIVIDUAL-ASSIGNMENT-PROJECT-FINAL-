<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduTrack dashboard: key statistics, course progress chart, task status and upcoming deadlines.">
  <meta name="keywords" content="EduTrack, dashboard, progress, deadlines">
  <meta name="author" content="Your Name">
  <title>Home | EduTrack</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('edutrack.theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-protected="true">

  <div id="topbar"></div>

  <div class="app-shell">

    <div class="app-content">
      <main class="container-fluid px-3 px-lg-4 py-4">

        <header class="mb-4">
          <h1 class="h3 mb-1">Welcome back, <span id="welcome-name">Student</span></h1>
          <p class="text-muted mb-0">Here is a summary of your courses and tasks.</p>
        </header>

        <section class="mb-4" aria-labelledby="stats-heading">
          <h2 id="stats-heading" class="visually-hidden">Key statistics</h2>
          <div class="row g-3" id="stat-cards"></div>
        </section>

        <section class="row g-4 mb-4" aria-labelledby="charts-heading">
          <h2 id="charts-heading" class="visually-hidden">Charts</h2>
          <div class="col-xl-8">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h3 class="h6 card-title">Course progress</h3>
                <p class="small text-muted">Completion percentage for each enrolled course.</p>
                <div class="chart-wrap">
                  <canvas id="progressChart" role="img" aria-label="Bar chart showing progress percentage for each course"></canvas>
                </div>
              </div>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <h3 class="h6 card-title">Task status</h3>
                <p class="small text-muted">Breakdown of all tasks by current status.</p>
                <div class="chart-wrap">
                  <canvas id="statusChart" role="img" aria-label="Doughnut chart showing the number of tasks in each status"></canvas>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section aria-labelledby="deadlines-heading">
          <h2 id="deadlines-heading" class="h5 mb-3">Upcoming deadlines</h2>
          <ul class="list-group shadow-sm" id="deadline-list"></ul>
        </section>

      </main>

      <div id="site-footer"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/ed.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
